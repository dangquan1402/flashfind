[workspace]
resolver = "2"
members = ["crates/flashfind-core", "crates/flashfind-code", "crates/flashfind-cli", "crates/flashfind-ffi"]
exclude = ["bench/fsearch-baseline", "bench/vs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
rayon = "1.10"
memchr = "2.7"
memmap2 = "0.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
