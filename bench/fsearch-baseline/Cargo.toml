[package]
name = "fsearch-baseline"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Benchmarks upstream fsearch (as a library) on the same tree and queries as flashfind"

# Upstream fsearch checkout, expected next to this repo (~/dev/fsearch when
# the repo is ~/dev/flashfind). Override with a [patch] or by editing.
[dependencies]
fsearch = { path = "../../../fsearch" }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
